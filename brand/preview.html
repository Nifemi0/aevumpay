<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AevumPay — brand</title>
<style>
  :root{--lime:#b8e77f;--ink:#183409;--muted:#5f7350;--line:#e6efd8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fbfdf7;color:var(--ink);padding:28px;width:760px}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 12px;font-weight:700}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .tile{border-radius:20px;padding:26px;border:1px solid var(--line);display:grid;place-items:center}
  .tile.light{background:#fff}
  .tile.lime{background:var(--lime)}
  .tile.dark{background:#14260a;border-color:#14260a}
  .tile.dark .word{color:#eafbd6}
  .word{font-weight:800;font-size:26px;letter-spacing:-.5px;margin-top:12px}
  .word span{color:#4c9e2e}
  .tile.dark .word span{color:#a9df67}
  .mark{width:96px;height:96px}
  .mark-sm{width:44px;height:44px}
  .mark-lg{width:180px;height:180px}
  .full{width:420px;height:auto;max-width:100%}
  .cap{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
  .palette{display:flex;gap:10px;margin-top:6px}
  .sw{flex:1;border-radius:12px;padding:14px 12px;font-size:11px;font-weight:700;color:#fff}
</style>
</head>
<body>
  <h1>Mark</h1>
  <div class="row">
    <div class="tile light"><svg class="mark" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdf39c"/><stop offset="1" stop-color="#9dd658"/></linearGradient></defs><rect width="512" height="512" rx="132" fill="url(#bg)"/><rect x="18" y="18" width="476" height="476" rx="118" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="4"/><text x="256" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="300" fill="#183409">@</text><path d="M392 150 h44 v44" fill="none" stroke="#183409" stroke-opacity=".9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M436 150 l-58 58" fill="none" stroke="#183409" stroke-opacity=".9" stroke-width="20" stroke-linecap="round"/></svg></div>
    <div class="tile lime"><svg class="mark" viewBox="0 0 512 512"><defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".0"/></linearGradient></defs><rect width="512" height="512" rx="132" fill="#183409"/><text x="256" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="300" fill="#b8e77f">@</text><path d="M392 150 h44 v44" fill="none" stroke="#b8e77f" stroke-opacity=".9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M436 150 l-58 58" fill="none" stroke="#b8e77f" stroke-opacity=".9" stroke-width="20" stroke-linecap="round"/></svg></div>
    <div class="tile dark"><svg class="mark" viewBox="0 0 512 512"><rect width="512" height="512" rx="132" fill="#b8e77f"/><text x="256" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="300" fill="#183409">@</text><path d="M392 150 h44 v44" fill="none" stroke="#183409" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M436 150 l-58 58" fill="none" stroke="#183409" stroke-width="20" stroke-linecap="round"/></svg></div>
  </div>

  <h1>Wordmark</h1>
  <div class="row">
    <div class="tile group">
      <div style="display:flex;align-items:center;gap:14px">
        <svg class="mark-sm" viewBox="0 0 512 512"><rect width="512" height="512" rx="132" fill="#b8e77f"/><text x="256" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="300" fill="#183409">@</text></svg>
        <div class="word">Aevum<span>Pay</span></div>
      </div>
      <div class="cap">horizontal lockup</div>
    </div>
    <div class="tile light"><div class="word" style="text-align:center">Aevum<span>Pay</span></div><div class="cap">text only</div></div>
  </div>

  <h1>Full logo</h1>
  <div class="tile light"><svg class="full" viewBox="0 0 1360 360"><defs><linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdf39c"/><stop offset="1" stop-color="#9dd658"/></linearGradient></defs><g transform="translate(20,20)"><rect width="320" height="320" rx="82" fill="url(#bgf)"/><rect x="10" y="10" width="300" height="300" rx="74" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/><text x="160" y="180" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="188" fill="#183409">@</text><path d="M245 94 h28 v28" fill="none" stroke="#183409" stroke-opacity=".9" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M273 94 l-37 37" fill="none" stroke="#183409" stroke-opacity=".9" stroke-width="13" stroke-linecap="round"/></g><text x="392" y="196" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="150" letter-spacing="-4" fill="#183409">Aevum<tspan fill="#4c9e2e">Pay</tspan></text><text x="398" y="262" font-family="Inter,system-ui,sans-serif" font-weight="600" font-size="40" fill="#5f7350">money that knows your @name</text></svg></div>

  <h1>Palette</h1>
  <div class="palette">
    <div class="sw" style="background:#b8e77f;color:#183409">Lime #B8E77F</div>
    <div class="sw" style="background:#183409">Ink #183409</div>
    <div class="sw" style="background:#4c9e2e">Green #4C9E2E</div>
    <div class="sw" style="background:#5f7350">Muted #5F7350</div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AevumPay logo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 32px 16px; font-family: Outfit, system-ui, sans-serif; background: #f4f8ee; color: #152709; display: grid; gap: 32px; justify-items: center; }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
  img { display: block; }
  .dark { background: #152709; padding: 24px; border-radius: 24px; }
  p { margin: 0; font-size: 15px; opacity: 0.7; max-width: 46ch; text-align: center; }
</style>
</head>
<body>
  <img src="logo-full.svg" width="520" alt="AevumPay logo">
  <div class="row">
    <img src="logo-mark.svg" width="128" alt="AevumPay mark">
    <img src="logo-mark.svg" width="64" alt="">
    <img src="logo-mark.svg" width="32" alt="">
    <img src="logo-mark.svg" width="16" alt="">
    <div class="dark"><img src="logo-mark-lime.svg" width="96" alt="AevumPay mark on dark"></div>
  </div>
  <p>An "@", because your name is your address, with a send arrow breaking out of it. Forest #152709 and lime #b8e77f.</p>
</body>
</html>

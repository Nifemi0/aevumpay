<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AevumPay">
  <!-- AevumPay mark: an eternity loop ("aevum" = an age, eternity): money that keeps moving.
       Forest #152709, lime #b8e77f. The same loop is the site's loading indicator. -->
  <rect width="512" height="512" rx="144" fill="#152709"/>
  <g transform="translate(96 96) scale(13.333)" fill="none" stroke="#b8e77f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 12c-3.2-4.2-9.4-4.2-9.4 0s6.2 4.2 9.4 0 9.4-4.2 9.4 0-6.2 4.2-9.4 0z"/>
  </g>
</svg>
